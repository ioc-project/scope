---
name: Build and Push

on:
  workflow_call:
    inputs:
      bake-targets:
        required: true
        type: string
        description: "Bake target"
      bake-file:
        required: false
        type: string
        description: "Bake file"
        default: "docker-bake.hcl"
      image-tag:
        required: true
        type: string
        description: "Image tag to use."
      image-repo:
        required: false
        type: string
        description: "Image repo to use."
        default: "ghcr.io/outshift-open/oxp"
      refresh-model-prices:
        required: false
        type: boolean
        description: "Pull the latest LLM price table from LiteLLM into the build context (not committed)."
        default: false
    secrets:
      github-token:
        description: "github token"
        required: false

jobs:
  build-and-push:
    name: Build and Push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 0

      # The images are built from the tagged commit, but should price LLM calls with
      # the current LiteLLM table. This refreshes the files in the build context
      # only; nothing is committed. If LiteLLM is unreachable or its file fails
      # validation, the build goes on with the table committed in the repo.
      - name: Refresh LLM model prices from LiteLLM
        if: ${{ inputs.refresh-model-prices }}
        run: |
          if python3 .github/scripts/update_model_prices.py --summary "$RUNNER_TEMP/price-summary.md"; then
            {
              echo "### LLM model prices (refreshed from LiteLLM for this build)"
              cat "$RUNNER_TEMP/price-summary.md"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Could not refresh the LLM price table from LiteLLM; building with the committed copy."
            git checkout -- backend/stateful-evals/stateful_evals_be/data backend/mce/mce-core/src/mce/engine/data || true
          fi

      - name: Login to GitHub Container Registry
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags') }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{github.actor}}
          password: ${{secrets.github-token}}

      - name: Setup QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@c47758b77c9736f4b2ef4073d4d51994fabfe349 # v3.7.1

      - name: Compute tags
        id: tags
        run: |
          {
            echo "overrides<<EOF"
            echo "*.tags=${{ inputs.image-repo }}:${{ inputs.image-tag }}"
            if [ "${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags') }}" = "true" ]; then
              echo "*.tags+=${{ inputs.image-repo }}:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/bake-action@5be5f02ff8819ecd3092ea6b2e6261c31774f2b4 # v6.10.0
        with:
          files: ${{ inputs.bake-file }}
          targets: ${{ inputs.bake-targets }}
          set: ${{ steps.tags.outputs.overrides }}
          push: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags') }}
          provenance: false
        env:
          IMAGE_REPO: ${{ inputs.image-repo }}
