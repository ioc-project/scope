  /api/v1/sessions/{session_id}/latent-space:
    get:
      tags:
      - v1
      - sessions
      summary: Get Session Latent Space
      description: "Get session states projected to 2D latent space using UMAP.\n\n\
        Projects state embeddings from the agent hierarchy level to a 2D space\nfor\
        \ visualization. Uses UMAP with cosine distance metric.\n\nNodes: States with\
        \ x,y coordinates from UMAP projection\nEdges: Transitions between states\
        \ (same as state machine graph)\n\nThe embeddings are retrieved from Embedding\
        \ nodes connected to State nodes\nvia the hasEmbedding relationship.\n\nArgs:\n\
        \    session_id: Session ID to fetch\n    n_neighbors: UMAP n_neighbors (default\
        \ 15, auto-adjusted if needed)\n    min_dist: UMAP min_dist (default 0.1,\
        \ controls clustering tightness)\n\nReturns:\n    LatentSpaceResponse with\
        \ nodes positioned in 2D space\n\nExample:\n    GET /graph/latent-space/0c589041-888a-449d-983e-19c6af599494\n\
        \    GET /graph/latent-space/0c589041-888a-449d-983e-19c6af599494?n_neighbors=10&min_dist=0.2"
      operationId: get_session_latent_space_api_v1_sessions__session_id__latent_space_get
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          title: Session Id
      - name: n_neighbors
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 2
          description: UMAP n_neighbors parameter (controls local vs global structure,
            will be adjusted if larger than n_samples-1)
          default: 15
          title: N Neighbors
        description: UMAP n_neighbors parameter (controls local vs global structure,
          will be adjusted if larger than n_samples-1)
      - name: min_dist
        in: query
        required: false
        schema:
          type: number
          maximum: 1.0
          minimum: 0.0
          description: UMAP min_dist parameter (controls how tightly points cluster
            together)
          default: 0.1
          title: Min Dist
        description: UMAP min_dist parameter (controls how tightly points cluster
          together)
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LatentSpaceResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
