  /api/v1/metrics/timeseries:
    get:
      tags:
      - v1
      - metrics
      summary: Get Metric Timeseries
      description: "Return aggregated time-series data for one metric.\n\n**Parameter\
        \ priority** (highest to lowest):\n\n1. ``start_time`` / ``end_time`` — Unix\
        \ epoch seconds (harmonized with ``/applications/{id}/charts``)\n2. ``duration``\
        \ — human-readable window relative to ``end_time`` or now\n3. ``window_hours``\
        \ — legacy integer window in hours\n4. ``start`` / ``end`` — explicit ISO-8601\
        \ datetimes\n\nWhen ``end_time`` / ``end`` are omitted the window extends\
        \ up to now (open-ended).\n\n**Examples**:\n\nUnix epoch (same format as ``/applications/{id}/charts``)::\n\
        \n    ?metric_id=Groundedness&start_time=1773187200&end_time=1773360000&bucket=day\n\
        \nHuman-readable duration ending now::\n\n    ?metric_id=Groundedness&duration=7d&bucket=day\n\
        \nHuman-readable duration ending at a specific epoch::\n\n    ?metric_id=Cost&duration=2w&end_time=1773360000&bucket=day\n\
        \nISO-8601 explicit range::\n\n    ?metric_id=Duration&start=2026-03-01T00:00:00Z&end=2026-03-13T00:00:00Z&bucket=day"
      operationId: get_metric_timeseries_api_v1_metrics_timeseries_get
      parameters:
      - name: metric_id
        in: query
        required: true
        schema:
          type: string
          description: Metric name, e.g. 'Groundedness'
          title: Metric Id
        description: Metric name, e.g. 'Groundedness'
      - name: start_time
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Unix epoch timestamp (seconds) for the start of the range.
            Takes precedence over 'start', 'duration', and 'window_hours' when provided.
          title: Start Time
        description: Unix epoch timestamp (seconds) for the start of the range. Takes
          precedence over 'start', 'duration', and 'window_hours' when provided.
      - name: end_time
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Unix epoch timestamp (seconds) for the end of the range. Defaults
            to now. Used together with 'start_time' or 'duration'.
          title: End Time
        description: Unix epoch timestamp (seconds) for the end of the range. Defaults
          to now. Used together with 'start_time' or 'duration'.
      - name: duration
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: 'Human-readable duration ending at ''end_time''/''end'' (or
            now). Combinations of w/d/h/m: ''7d'', ''2w'', ''24h'', ''1w3d6h''. Mutually
            exclusive with ''start_time'' and ''window_hours''.'
          title: Duration
        description: 'Human-readable duration ending at ''end_time''/''end'' (or now).
          Combinations of w/d/h/m: ''7d'', ''2w'', ''24h'', ''1w3d6h''. Mutually exclusive
          with ''start_time'' and ''window_hours''.'
      - name: window_hours
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            maximum: 8760
            minimum: 1
          - type: 'null'
          description: Rolling window in hours (legacy). Prefer 'duration'. Mutually
            exclusive with 'start_time' and 'start'.
          title: Window Hours
        description: Rolling window in hours (legacy). Prefer 'duration'. Mutually
          exclusive with 'start_time' and 'start'.
      - name: start
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          description: ISO-8601 start datetime (UTC). Used when neither start_time,
            duration nor window_hours is given.
          title: Start
        description: ISO-8601 start datetime (UTC). Used when neither start_time,
          duration nor window_hours is given.
      - name: end
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          description: ISO-8601 end datetime (UTC). Ignored when end_time is provided.
          title: End
        description: ISO-8601 end datetime (UTC). Ignored when end_time is provided.
      - name: bucket
        in: query
        required: false
        schema:
          enum:
          - minute
          - hour
          - day
          type: string
          description: Time-bucket granularity for aggregation.
          default: hour
          title: Bucket
        description: Time-bucket granularity for aggregation.
      - name: app_name
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: 'Filter by application name (alias: application_id).'
          title: App Name
        description: 'Filter by application name (alias: application_id).'
      - name: application_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter by application ID (alias for app_name).
          title: Application Id
        description: Filter by application ID (alias for app_name).
      - name: agent_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter by agent ID.
          title: Agent Id
        description: Filter by agent ID.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricTimeSeriesResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
