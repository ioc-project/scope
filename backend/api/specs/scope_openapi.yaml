  /api/v1/live_topology/sessions/{session_id}/topology:
    get:
      tags:
      - v1
      - live_topology
      summary: Get Realtime Topology
      description: 'Return a real-time topology graph for a session.


        Combines the static graph structure (nodes, edges) derived from the most

        recent ``*.graph`` span for the session with live status information sourced

        from ``topology.node.*`` and ``tool.*`` events in ``otel_logs``.


        Each node carries:

        - ``type``: ``"agent"`` or ``"tool"``

        - ``status``: ``"active"``, ``"completed"``, or ``"unknown"``

        - ``start_time`` / ``end_time``: ISO timestamps from live events

        - ``description``: agent description if available

        - ``data``: tool list for agent nodes that expose tools'
      operationId: get_realtime_topology_api_v1_live_topology_sessions__session_id__topology_get
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          title: Session Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RealtimeTopologyResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
