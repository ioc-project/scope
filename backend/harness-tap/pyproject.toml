[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ioc-harness-tap"
version = "0.1.0"
description = "Local tap for coding-agent harnesses: hook events + Codex rollout reconciliation -> OTLP spans."
license = { text = "Apache-2.0" }
requires-python = ">=3.9"
# Deliberately stdlib-only: hooks run on developer laptops, often without a
# writable or online Python environment.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.12"]

[project.scripts]
harness-tap = "harness_tap.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--tb=short -q"
