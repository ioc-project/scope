[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ioc-scope-mce-client"
version = "0.1.0"
authors = [
    { name = "Outshift Open", email = "oss-github@cisco.com" }
]
license = "Apache-2.0"
description = "High-level client for the Metrics Computation Engine"
requires-python = ">=3.13,<3.15"
dependencies = [
    "ioc-scope-mce-core>=2.0.0rc1",
    "ioc-scope-mce-helper>=0.1.0",
    "ioc-scope-api>=0.1.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",
    "pydantic>=2.0.0",
    "click>=8.0.0",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
]

[project.scripts]
mce = "mce.cli.main:app"
mce-server = "mce.api.server:main"
mce-client = "mce.client.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
include = ["mce.api*", "mce.cli*", "mce.client*"]
namespaces = true

[tool.setuptools.package-data]
"mce.client" = ["schema/*.yaml"]

[tool.uv.sources]
ioc-scope-mce-core = { workspace = true }
ioc-scope-mce-helper = { workspace = true }