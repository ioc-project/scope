[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ioc-scope-mce"
version = "2.0.0"
authors = [
    { name = "Outshift Open", email = "oss-github@cisco.com" }
]
license = "Apache-2.0"
description = "Metrics Computation Engine metapackage"
requires-python = ">=3.13,<3.15"
dependencies = [
    "ioc-scope-mce-core>=2.0.0",
    "ioc-scope-mce-helper>=2.0.0",
    "ioc-scope-mce-client>=2.0.0",
    "ioc-scope-mce-legacy>=2.0.0",
    "ioc-scope-mce-provider-native>=2.0.0",
    "ioc-scope-mce-provider-sdk>=2.0.0",
    "ioc-scope-mce-provider-deepeval>=2.0.0",
    "ioc-scope-mce-provider-opik>=2.0.0",
    "ioc-scope-mce-provider-ragas>=2.0.0",
]

[tool.uv.sources]
ioc-scope-mce-core = { workspace = true }
ioc-scope-mce-helper = { workspace = true }
ioc-scope-mce-client = { workspace = true }
ioc-scope-mce-legacy = { workspace = true }
ioc-scope-mce-provider-native = { workspace = true }
ioc-scope-mce-provider-sdk = { workspace = true }
ioc-scope-mce-provider-deepeval = { workspace = true }
ioc-scope-mce-provider-opik = { workspace = true }
ioc-scope-mce-provider-ragas = { workspace = true }