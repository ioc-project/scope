[project]
name = "scope-lib"
version = "1.0.0"
authors = [
    { name = "IoC project", email = "oss@cisco.com" }
]
license = "Apache-2.0"
description = "SCOPE backend workspace aggregating dem, mce, and norm"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "dem[all]",
    "scope-mce",
    "norm",
]

[tool.uv.workspace]
members = [
    "../ontology",
    "api",
    "dem",
    "mce/mce-meta",
    "mce/mce-core",
    "mce/mce-helper",
    "mce/mce-client",
    "mce/mce-legacy",
    "mce/mce-provider-native",
    "mce/mce-provider-sdk",
    "mce/mce-provider-deepeval",
    "mce/mce-provider-opik",
    "mce/mce-provider-ragas",
    "norm",
    "workers/norm-worker",
    "workers/embedding-worker",
    "workers/hierarchical-grouping-worker",
    "workers/mce-worker",
    "workers/normal-behaviour-worker",
    "workers/grouping-worker",
    "workers/consistency-worker",
    "workers/anomaly-detection-worker",
    "workers/analysis-worker",
    "workers/stateful-eval-worker",
    "workers/cognitive-failure-worker",
    "workers/cognition-protocols-worker",
    "workers/intelligence-worker",
    "worker-base",
    "stateful-evals",
]

[tool.uv]
# The protocol MCE plugins pin scope-mce-core to a git ref for standalone use; here it is the workspace member.
override-dependencies = ["scope-mce-core"]

[tool.uv.sources]
scope-ontology = { workspace = true }
dem = { workspace = true }
scope-mce = { workspace = true }
scope-api = { workspace = true }
scope-mce-core = { workspace = true }
scope-mce-helper = { workspace = true }
scope-mce-client = { workspace = true }
scope-mce-legacy = { workspace = true }
scope-mce-provider-native = { workspace = true }
scope-mce-provider-sdk = { workspace = true }
scope-mce-provider-deepeval = { workspace = true }
scope-mce-provider-opik = { workspace = true }
scope-mce-provider-ragas = { workspace = true }
norm = { workspace = true }
norm-worker = { workspace = true }
hierarchical-grouping-worker = { workspace = true }
mce-worker = { workspace = true }
normal-behaviour-worker = { workspace = true }
grouping-worker = { workspace = true }
consistency-worker = { workspace = true }
anomaly-detection-worker = { workspace = true }
analysis-worker = { workspace = true }
stateful-eval-worker = { workspace = true }
cognition-protocols-worker = { workspace = true }
stateful-evals = { workspace = true }
intelligence-worker = { workspace = true }
worker-base = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pytest-mock>=3.15.1",
    "pytest-asyncio>=0.21.0",
    "requests-mock",
    "pytest-docker>=3.2.5",
    "ruff<=0.15.22",
]

[tool.pytest.ini_options]
# Root pytest should only run root-owned package suites.
testpaths = [
    "dem/src/dem/tests",
]
pythonpath = [
    "dem/src",
]
addopts = [
    "--import-mode=importlib",
]
