[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "symbolic-extractor"
version = "1.2.0"
authors = [
    { name = "IoC project", email = "oss-github@cisco.com" }
]
license = "Apache-2.0"
description = "Extracts symbolic state elements (Fact, Claim, Goal, Task, Constraint, AgentCapability, SystemPrompt) from a SCOPE session knowledge graph."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  # SCOPE API library: used to read from and write to the KG.
  "ioc-scope-api",
  "ioc-scope-ontology[models]>=1.2.0",
  "pydantic>=2.0.0",
  "python-dotenv>=1.0.0",
  "openai>=1.0.0",
]

[project.optional-dependencies]
# Text embeddings reuse the embedders of dem (torch & co. come with it).
embeddings = [
  "dem[embedding]",
]
dev = [
  "pytest>=7.0",
  "ruff>=0.12.10",
]

[project.scripts]
symbolic-extractor = "symbolic_extractor.__main__:main"
symbolic-extractor-embeddings = "symbolic_extractor.embeddings:main"

[tool.hatch.build.targets.wheel]
packages = ["src/symbolic_extractor"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--tb=short -q"
markers = [
  "live: calls a real LLM (needs credentials in .env); skipped unless run with --live",
]
