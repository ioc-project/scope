[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "failure-detection-worker"
version = "1.2.0"
authors = [
    { name = "IoC project", email = "oss-github@cisco.com" }
]
license = "Apache-2.0"
description = "Worker that runs the deterministic cognitive-failure detectors over the symbolic state of a session and writes CognitiveFailureReports to the KG."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "failure-detection",
  "symbolic-extractor",
  "ioc-scope-api",
  "ioc-scope-worker-base",
  "ioc-scope-ontology[models]>=1.2.0",
  "pydantic>=2.0.0",
  "python-dotenv>=1.0.0",
  "click>=8.0.0",
  "aio_pika>=8.0.0",
  "pika>=1.3.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-asyncio>=0.24.0", "ruff>=0.12.10"]

[project.scripts]
failure-detection-worker-cli = "failure_detection_worker.cli:main"

[tool.uv.sources]
failure-detection = { workspace = true }
symbolic-extractor = { workspace = true }
ioc-scope-api = { workspace = true }
ioc-scope-worker-base = { workspace = true }
ioc-scope-ontology = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/failure_detection_worker"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]  # docstrings and comments run long, as in the rest of scope

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]
