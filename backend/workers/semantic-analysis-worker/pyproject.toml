[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "semantic-analysis-worker"
version = "1.0.0"
authors = [
    { name = "Outshift Open", email = "oss-github@cisco.com" }
]
license = "Apache-2.0"
description = "Semantic analysis workers (grouping, hierarchical grouping, analysis, intelligence) in one process"
readme = "README.md"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

requires-python = ">=3.11"
dependencies = [
    "grouping-worker",
    "hierarchical-grouping-worker",
    "analysis-worker",
    "intelligence-worker",
    "worker-base",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
semantic-analysis-worker-cli = "semantic_analysis_worker.cli:main"

[tool.uv.sources]
grouping-worker = { workspace = true }
hierarchical-grouping-worker = { workspace = true }
analysis-worker = { workspace = true }
intelligence-worker = { workspace = true }
worker-base = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/semantic_analysis_worker"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
