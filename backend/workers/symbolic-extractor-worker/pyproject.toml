[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "symbolic-extractor-worker"
version = "1.2.0"
authors = [
    { name = "IoC project", email = "oss-github@cisco.com" }
]
license = "Apache-2.0"
description = "Worker that extracts the symbolic state (claims, facts, goals, tasks, ...) of a session and writes it to the KG."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "symbolic-extractor",
  "ioc-scope-api",
  "ioc-scope-worker-base",
  "ioc-scope-ontology[models]>=1.2.0",
  # API embedders only (the extra of the embedding worker): no torch.
  "dem[embedding]",
  "pydantic>=2.0.0",
  "python-dotenv>=1.0.0",
  "click>=8.0.0",
  "aio_pika>=8.0.0",
  "pika>=1.3.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-asyncio>=0.24.0", "ruff>=0.12.10"]

[project.scripts]
symbolic-extractor-worker-cli = "symbolic_extractor_worker.cli:main"

[tool.uv.sources]
symbolic-extractor = { workspace = true }
ioc-scope-api = { workspace = true }
ioc-scope-worker-base = { workspace = true }
ioc-scope-ontology = { workspace = true }
dem = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/symbolic_extractor_worker"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]  # docstrings and comments run long, as in the rest of scope

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]
