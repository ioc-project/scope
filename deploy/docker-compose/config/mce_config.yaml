#
# Mirrors workers.mce.config in k8s/charts/scope/values.yaml.
engine:
  max_workers: 32
  execution_strategy: hybrid
cache:
  path: null
  read: true
  write: true
metrics:
  Session:
    - Duration
    - Cost
    - AnswerRelevancy
    - IntentRecognitionAccuracy
    - Groundedness
    - ToolUtilizationAccuracy
    - ResponseCompleteness
    - TaskCompletion
    - WorkflowEfficiency
    - CyclesCount
    - ToolErrorRate
    - LLMErrorRate
