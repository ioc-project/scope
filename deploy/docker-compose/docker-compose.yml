#
# Docker Compose deployment of the whole SCOPE stack: it runs the same components as the
# k8s/charts/scope umbrella chart (gateway, UI, API + Redis, OTel collector, ClickHouse,
# RabbitMQ, Neo4j, the session-end trigger and the processing workers).
#
#   cp .env.template .env      # then set LLM_* and the passwords
#   docker compose up -d       # pulls the images
#   docker compose up -d --build   # or builds them from this checkout
#
# UI + API: http://localhost:${SCOPE_PORT:-8080}      OTLP: localhost:4317 (gRPC) / :4318 (HTTP)
name: scope-compose

x-rabbitmq-env: &rabbitmq-env
  RABBITMQ_HOST: rabbitmq
  RABBITMQ_PORT: "5672"
  RABBITMQ_USER: ${RABBITMQ_USERNAME:-scope}
  RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-change-me}
  RABBITMQ_VHOST: /

x-neo4j-env: &neo4j-env
  NEO4J_HOST: neo4j
  NEO4J_PORT: "7687"
  NEO4J_URI: bolt://neo4j:7687
  NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-change-me}
  NEO4J_DB: neo4j

x-clickhouse-env: &clickhouse-env
  CLICKHOUSE_HOST: clickhouse
  CLICKHOUSE_PORT: "8123"
  CLICKHOUSE_USERNAME: ${CLICKHOUSE_USERNAME:-scope}
  CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-change-me}
  CLICKHOUSE_DATABASE: ${CLICKHOUSE_DATABASE:-default}

# Mirrors the secrets.llm Secret of the chart.
x-llm-env: &llm-env
  LLM_MODEL_NAME: ${LLM_MODEL_NAME:?set LLM_MODEL_NAME in .env}
  EMBEDDING_MODEL: ${EMBEDDING_MODEL_NAME:?set EMBEDDING_MODEL_NAME in .env}
  OPENAI_API_KEY: ${LLM_GATEWAY_API_KEY:-}
  AI_GATEWAY_API_KEY: ${LLM_GATEWAY_API_KEY:-}
  AI_GATEWAY_BASE_URL: ${LLM_GATEWAY_BASE_URL:-}
  LLM_API_KEY: ${LLM_GATEWAY_API_KEY:-}
  LLM_BASE_MODEL_URL: ${LLM_GATEWAY_BASE_URL:-}
  LLM_BASE_MODEL_URL_MCE: ${LLM_GATEWAY_BASE_URL:-}

x-worker: &worker
  restart: unless-stopped

services:

  # ---------------------------------------------------------------- infrastructure

  clickhouse:
    image: clickhouse/clickhouse-server:25.7-alpine
    restart: unless-stopped
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USERNAME:-scope}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-change-me}
      CLICKHOUSE_DB: ${CLICKHOUSE_DATABASE:-default}
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8123/ping || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  rabbitmq:
    image: rabbitmq:4.1-management
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-scope}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-change-me}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    ports:
      - "127.0.0.1:${RABBITMQ_AMQP_PORT:-5672}:5672"
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  neo4j:
    image: neo4j:latest
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-change-me}
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    ports:
      - "127.0.0.1:${NEO4J_HTTP_PORT:-7474}:7474"
      - "127.0.0.1:${NEO4J_BOLT_PORT:-7687}:7687"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:7474 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.131.0
    restart: unless-stopped
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USERNAME:-scope}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-change-me}
      CLICKHOUSE_DATABASE: ${CLICKHOUSE_DATABASE:-default}
    volumes:
      - ./config/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "${OTLP_GRPC_PORT:-4317}:4317"
      - "${OTLP_HTTP_PORT:-4318}:4318"
    depends_on:
      clickhouse:
        condition: service_healthy

  # One-shot equivalent of the chart's post-install clickhouse-setup Job.
  clickhouse-setup:
    image: clickhouse/clickhouse-server:25.7-alpine
    restart: on-failure
    entrypoint: ["sh", "/scripts/clickhouse-setup.sh"]
    environment:
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "9000"
      CLICKHOUSE_USER: ${CLICKHOUSE_USERNAME:-scope}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-change-me}
      CLICKHOUSE_DATABASE: ${CLICKHOUSE_DATABASE:-default}
    volumes:
      - ./scripts/clickhouse-setup.sh:/scripts/clickhouse-setup.sh:ro
    depends_on:
      clickhouse:
        condition: service_healthy
      otel-collector:
        condition: service_started

  # Publishes a message to the norm worker's queue for every session.end span.
  session-end-trigger:
    image: clickhouse/clickhouse-server:25.7-alpine
    restart: unless-stopped
    entrypoint: ["sh", "/scripts/session-end-trigger.sh"]
    environment:
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "9000"
      CLICKHOUSE_USER: ${CLICKHOUSE_USERNAME:-scope}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-change-me}
      CLICKHOUSE_DATABASE: ${CLICKHOUSE_DATABASE:-default}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USERNAME:-scope}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-change-me}
      RABBITMQ_VHOST: /
      EXCHANGE_NAME: new_session_to_norm
      TARGET_QUEUE: new_session_to_norm
      CURSOR_TABLE: session_end_trigger_cursor
      POLL_INTERVAL_SECONDS: "3"
    volumes:
      - ./scripts/session-end-trigger.sh:/scripts/session-end-trigger.sh:ro
    depends_on:
      clickhouse:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      norm:
        condition: service_started

  # ------------------------------------------------------------------ api and ui

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    image: ${SCOPE_IMAGE_REGISTRY:-ghcr.io/ioc-project/container-images}/scope-api:${SCOPE_VERSION:-1.0.2}
    build:
      context: ../../backend
      additional_contexts:
        ontology: ../../ontology
      dockerfile: api/Dockerfile
    restart: unless-stopped
    environment:
      <<: [*clickhouse-env, *neo4j-env]
      SCOPE_API_PORT: "8000"
      SCOPE_LOCAL: "false"
      SCOPE_API_RELOAD: "false"
      NEO4J_DATABASE: neo4j
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      CACHE_ENABLED: "true"
      CACHE_REDIS_URL: redis://redis:6379/0
      CACHE_TTL_SECONDS: "300"
    healthcheck:
      test: ["CMD", "/app/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=4)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      clickhouse:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy

  ui:
    image: ${SCOPE_IMAGE_REGISTRY:-ghcr.io/ioc-project/container-images}/scope-ui:${SCOPE_VERSION:-1.0.2}
    build:
      context: ../../ui
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      VITE_API_PROXY_URL: http://api:8000
      VITE_REST_API_URL: /api/v1
      VITE_FF_SEMANTIC_GROUPS: ${FF_SEMANTIC_GROUPS:-true}
      VITE_FF_INSIGHTS: ${FF_INSIGHTS:-true}
      VITE_FF_LIVE_TOPOLOGY: ${FF_LIVE_TOPOLOGY:-true}
      VITE_FF_STATEFUL_EVAL: ${FF_STATEFUL_EVAL:-true}
      VITE_FF_IMPACT_ASSESSMENT: ${FF_IMPACT_ASSESSMENT:-false}
      VITE_FF_WASTE_ESTIMATION: ${FF_WASTE_ESTIMATION:-false}
      VITE_FF_NEUROSYMBOLIC_EVAL: ${FF_NEUROSYMBOLIC_EVAL:-false}
      VITE_FF_COGNITIVE_OBSERVABILITY: ${FF_COGNITIVE_OBSERVABILITY:-false}
      VITE_FF_COGNITION_PROTOCOLS: ${FF_COGNITION_PROTOCOLS:-false}
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    # The UI's nginx resolves the API host at startup and exits if it is not there yet.
    depends_on:
      api:
        condition: service_healthy

  # Single entry point routing /gql and /api/* to the API and everything else to the UI.
  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./config/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${SCOPE_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
      ui:
        condition: service_healthy

  # --------------------------------------------------------------------- workers

  norm:
    image: ${SCOPE_IMAGE_REGISTRY:-ghcr.io/ioc-project/container-images}/scope-norm-worker:${SCOPE_VERSION:-1.0.2}
    build:
      context: ../../backend
      additional_contexts:
        ontology: ../../ontology
      dockerfile: workers/norm-worker/deploy/docker/Dockerfile
    <<: *worker
    environment:
      <<: [*rabbitmq-env, *neo4j-env, *clickhouse-env]
      NORM_INPUT_QUEUE: new_session_to_norm
      NORM_OUTPUT_QUEUE: new_session_to_mce,new_session_to_emb
      MAX_INFLIGHT_MESSAGES: "128"
    depends_on:
      rabbitmq:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      clickhouse:
        condition: service_healthy

  embedding:
    image: ${SCOPE_IMAGE_REGISTRY:-ghcr.io/ioc-project/container-images}/scope-embedding-worker:${SCOPE_VERSION:-1.0.2}
    build:
      context: ../../backend
      additional_contexts:
        ontology: ../../ontology
      dockerfile: workers/embedding-worker/deploy/docker/Dockerfile
    <<: *worker
    environment:
      <<: [*rabbitmq-env, *neo4j-env, *llm-env]
      EMBEDDING_INPUT_QUEUE: new_session_to_emb
      # The queues of the cognitive-failure and cognition-protocols workers are last: remove one here, and stop the
      # worker, to turn it off.
      EMBEDDING_OUTPUT_QUEUE: ${EMBEDDING_OUTPUT_QUEUE:-new_session_to_grouping,new_session_to_stateful_eval,new_session_to_cognitive_failure,new_session_to_cognition_protocols}
      EMBEDDING_EMBEDDER_TYPE: OpenAIEmbedder
      MAX_INFLIGHT_MESSAGES: "32"
    depends_on:
      rabbitmq:
        condition: service_healthy
      neo4j:
        condition: service_healthy

  mce:
    image: ${SCOPE_IMAGE_REGISTRY:-ghcr.io/ioc-project/container-images}/scope-mce-worker:${SCOPE_VERSION:-1.0.2}
    build:
      context: ../../backend
      additional_contexts:
        ontology: ../../ontology
      dockerfile: workers/mce-worker/deploy/docker/Dockerfile
    <<: *worker
    environment:
      <<: [*rabbitmq-env, *neo4j-env, *llm-env]
      MCE_INPUT_QUEUE: new_session_to_mce
      MCE_OUTPUT_QUEUE: ""
      MCE_CONFIG_PATH: /scope/mce_config.yaml
      MAX_INFLIGHT_MESSAGES: "64"
    volumes:
      - ./config/mce_config.yaml:/scope/mce_config.yaml:ro
    depends_on:
      rabbitmq:
        condition: service_healthy
      neo4j:
        condition: service_healthy

  grouping:
    image: ${SCOPE_IMAGE_REGISTRY:-ghcr.io/ioc-project/container-images}/scope-grouping-worker:${SCOPE_VERSION:-1.0.2}
    build:
      context: ../../backend
      additional_contexts:
        ontology: ../../ontology
      dockerfile: workers/grouping-worker/deploy/docker/Dockerfile
    <<: *worker
    environment:
      <<: [*rabbitmq-env, *neo4j-env, *llm-env]
      GROUPING_INPUT_QUEUE: new_session_to_grouping
      GROUPING_OUTPUT_QUEUE: new_session_to_analysis
      GROUPING_EMBEDDING_MODEL: ${EMBEDDING_MODEL_NAME:?set EMBEDDING_MODEL_NAME in .env}
      GROUPING_MAX_DISTANCE: "0.3"
      GROUPING_MAX_NEIGHBORS: "10"
      MAX_INFLIGHT_MESSAGES: "16"
    depends_on:
      rabbitmq:
        condition: service_healthy
      neo4j:
        condition: service_healthy

  hierarchical-grouping:
    image: ${SCOPE_IMAGE_REGISTRY:-ghcr.io/ioc-project/container-images}/scope-hierarchical-grouping-worker:${SCOPE_VERSION:-1.0.2}
    build:
      context: ../../backend
      additional_contexts:
        ontology: ../../ontology
      dockerfile: workers/hierarchical-grouping-worker/deploy/docker/Dockerfile
    <<: *worker
    environment:
      <<: [*rabbitmq-env, *neo4j-env, *llm-env]
      HIERARCHICAL_GROUPING_INPUT_QUEUE: new_session_to_periodic_grouping
      HIERARCHICAL_GROUPING_OUTPUT_QUEUE: new_session_to_analysis
      HIERARCHICAL_GROUPING_EMBEDDING_MODEL: ${EMBEDDING_MODEL_NAME:?set EMBEDDING_MODEL_NAME in .env}
      HIERARCHICAL_GROUPING_MAX_NEIGHBORS: "10"
      HIERARCHICAL_GROUPING_MIN_SAMPLES: "20"
      HIERARCHICAL_GROUPING_MAX_DISTANCE: "0.15"
      PERIODIC_TRIGGER_INTERVAL_SECONDS: "900"
      MAX_INFLIGHT_MESSAGES: "1"
    depends_on:
      rabbitmq:
        condition: service_healthy
      neo4j:
        condition: service_healthy

  intelligence:
    image: ${SCOPE_IMAGE_REGISTRY:-ghcr.io/ioc-project/container-images}/scope-intelligence-worker:${SCOPE_VERSION:-1.0.2}
    build:
      context: ../../backend
      additional_contexts:
        ontology: ../../ontology
      dockerfile: workers/intelligence-worker/deploy/docker/Dockerfile
    <<: *worker
    environment:
      <<: [*rabbitmq-env, *neo4j-env]
      INTELLIGENCE_INPUT_QUEUE: new_session_to_intelligence
      INTELLIGENCE_CATALOG_ROOT: /app/intelligence-catalog
      PERIODIC_TRIGGER_INTERVAL_SECONDS: "300"
      MAX_INFLIGHT_MESSAGES: "1"
    depends_on:
      rabbitmq:
        condition: service_healthy
      neo4j:
        condition: service_healthy

  analysis:
    image: ${SCOPE_IMAGE_REGISTRY:-ghcr.io/ioc-project/container-images}/scope-analysis-worker:${SCOPE_VERSION:-1.0.2}
    build:
      context: ../../backend
      additional_contexts:
        ontology: ../../ontology
      dockerfile: workers/analysis-worker/deploy/docker/Dockerfile
    <<: *worker
    environment:
      <<: [*rabbitmq-env, *neo4j-env, *llm-env]
      ANALYSIS_INPUT_QUEUE: new_session_to_analysis
      ANOMALY_CONFIG_FILE: ""
      CONSISTENCY_CONFIG_FILE: ""
      NORMAL_BEHAVIOUR_CONFIG_FILE: ""
      MAX_INFLIGHT_MESSAGES: "6"
    command: ["--batch_size", "20"]
    depends_on:
      rabbitmq:
        condition: service_healthy
      neo4j:
        condition: service_healthy

  stateful-eval:
    image: ${SCOPE_IMAGE_REGISTRY:-ghcr.io/ioc-project/container-images}/scope-stateful-eval-worker:${SCOPE_VERSION:-1.0.2}
    build:
      context: ../../backend
      additional_contexts:
        ontology: ../../ontology
      dockerfile: workers/stateful-eval-worker/deploy/docker/Dockerfile
    <<: *worker
    environment:
      <<: [*rabbitmq-env, *neo4j-env, *llm-env]
      STATEFUL_EVAL_INPUT_QUEUE: new_session_to_stateful_eval
      STATEFUL_EVAL_OUTPUT_QUEUE: ""
      STATEFUL_EVAL_CONFIG_PATH: /scope/stateful_eval_config.yaml
      MAX_INFLIGHT_MESSAGES: "32"
    volumes:
      - ./config/stateful_eval_config.yaml:/scope/stateful_eval_config.yaml:ro
    depends_on:
      rabbitmq:
        condition: service_healthy
      neo4j:
        condition: service_healthy

  # Detects cognitive failures of the challenges taxonomy: it makes a judge-model call for each session.
  cognitive-failure:
    image: ${SCOPE_IMAGE_REGISTRY:-ghcr.io/ioc-project/container-images}/scope-cognitive-failure-worker:${SCOPE_VERSION:-1.0.2}
    build:
      context: ../../backend
      additional_contexts:
        ontology: ../../ontology
      dockerfile: workers/cognitive-failure-worker/deploy/docker/Dockerfile
    <<: *worker
    environment:
      <<: [*rabbitmq-env, *neo4j-env, *llm-env]
      COGNITIVE_FAILURE_INPUT_QUEUE: new_session_to_cognitive_failure
      COGNITIVE_FAILURE_OUTPUT_QUEUE: ""
      COGNITIVE_FAILURE_CONFIG_PATH: /scope/cognitive_failure_config.yaml
      MAX_INFLIGHT_MESSAGES: "8"
    volumes:
      - ./config/cognitive_failure_config.yaml:/scope/cognitive_failure_config.yaml:ro
    depends_on:
      rabbitmq:
        condition: service_healthy
      neo4j:
        condition: service_healthy

  # Detects which Cognition protocols (ACCORD, CONCORD) a session used, and evaluates the ones it used.
  # The protocol metric packages are private git dependencies, so the image is built with an SSH agent that
  # can read them (docker compose up --build needs `ssh-add -l` to list such a key). To run the stack without
  # it, stop the service and remove its queue from EMBEDDING_OUTPUT_QUEUE.
  cognition-protocols:
    image: ${SCOPE_IMAGE_REGISTRY:-ghcr.io/ioc-project/container-images}/scope-cognition-protocols-worker:${SCOPE_VERSION:-1.0.2}
    build:
      context: ../../backend
      additional_contexts:
        ontology: ../../ontology
      dockerfile: workers/cognition-protocols-worker/deploy/docker/Dockerfile
      ssh: [default]
    <<: *worker
    environment:
      <<: [*rabbitmq-env, *neo4j-env, *llm-env]
      COGNITION_PROTOCOLS_INPUT_QUEUE: new_session_to_cognition_protocols
      COGNITION_PROTOCOLS_OUTPUT_QUEUE: ""
      MAX_INFLIGHT_MESSAGES: "4"
    depends_on:
      rabbitmq:
        condition: service_healthy
      neo4j:
        condition: service_healthy

volumes:
  clickhouse-data:
  rabbitmq-data:
  neo4j-data:
  neo4j-logs:
