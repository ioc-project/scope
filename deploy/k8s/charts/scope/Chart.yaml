apiVersion: v2
name: ioc-scope
description: Umbrella Helm chart for the System for Cognitive Observability, Provenance and Explainability (SCOPE)
maintainers:
  - name: Outshift Open
    email: oss-github@cisco.com
type: application
version: 1.0.0
appVersion: "1.0.0"
dependencies:
  - name: ioc-scope-api
    alias: api
    version: 1.0.0
    repository: oci://ghcr.io/ioc-project/charts
    condition: api.enabled
  - name: ioc-scope-ui
    alias: ui
    version: 1.0.0
    repository: oci://ghcr.io/ioc-project/charts
    condition: ui.enabled
  - name: opentelemetry-collector
    alias: otelCollector
    version: 0.175.1
    repository: https://open-telemetry.github.io/opentelemetry-helm-charts
    condition: otelCollector.enabled
  - name: neo4j
    alias: neo4j
    version: 2026.9.0
    repository: https://neo4j.github.io/helm-charts/
    condition: neo4j.enabled
