{{- if .Values.clickhouse.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "scope.clickhouseName" . }}
  labels:
    {{- include "scope.labels" . | nindent 4 }}
    app.kubernetes.io/component: clickhouse
spec:
  type: ClusterIP
  selector:
    {{- include "scope.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: clickhouse
  ports:
    - name: http
      port: 8123
      targetPort: http
    - name: native
      port: 9000
      targetPort: native

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "scope.clickhouseName" . }}
  labels:
    {{- include "scope.labels" . | nindent 4 }}
    app.kubernetes.io/component: clickhouse
spec:
  serviceName: {{ include "scope.clickhouseName" . }}
  replicas: {{ default 1 .Values.clickhouse.replicaCount }}
  selector:
    matchLabels:
      {{- include "scope.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: clickhouse
  template:
    metadata:
      labels:
        {{- include "scope.labels" . | nindent 8 }}
        app.kubernetes.io/component: clickhouse
    spec:
      securityContext:
        fsGroup: 101
      {{- if not .Values.clickhouse.auth.existingSecret }}
      volumes:
        - name: clickhouse-users
          secret:
            secretName: {{ include "scope.clickhouseUsersSecretName" . }}
      {{- end }}
      containers:
        - name: clickhouse
          image: "{{ .Values.clickhouse.image.repository }}:{{ .Values.clickhouse.image.tag }}"
          imagePullPolicy: {{ .Values.clickhouse.image.pullPolicy }}
          {{- if .Values.clickhouse.auth.existingSecret }}
          env:
            - name: CLICKHOUSE_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "scope.clickhouseSecretName" . }}
                  key: {{ .Values.clickhouse.auth.usernameKey }}
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "scope.clickhouseSecretName" . }}
                  key: {{ .Values.clickhouse.auth.passwordKey }}
          {{- end }}
          ports:
            - name: http
              containerPort: 8123
            - name: native
              containerPort: 9000
          readinessProbe:
            tcpSocket:
              port: native
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: native
            initialDelaySeconds: 20
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /var/lib/clickhouse
            {{- if not .Values.clickhouse.auth.existingSecret }}
            - name: clickhouse-users
              mountPath: /etc/clickhouse-server/users.d/zz-scope-users.xml
              subPath: users.xml
            {{- end }}
          resources:
            {{- toYaml .Values.clickhouse.resources | nindent 12 }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: {{ .Values.clickhouse.persistence.size | default "5Gi" }}
        {{- with .Values.clickhouse.persistence.storageClassName }}
        storageClassName: {{ . | quote }}
        {{- end }}
{{- end }}