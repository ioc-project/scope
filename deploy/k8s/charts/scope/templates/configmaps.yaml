apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "scope.workerEnvConfigMapName" . }}
  labels:
    {{- include "scope.labels" . | nindent 4 }}
data:
  {{- range $key, $value := .Values.workers.globalExtraEnv }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "scope.mceConfigMapName" . }}
  labels:
    {{- include "scope.labels" . | nindent 4 }}
data:
  mce_config.yaml: |
{{ toYaml (default dict .Values.workers.mce.config) | indent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "scope.statefulEvalConfigMapName" . }}
  labels:
    {{- include "scope.labels" . | nindent 4 }}
data:
  stateful_eval_config.yaml: |
{{ toYaml (default dict (index .Values.workers "stateful-eval").config) | indent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "scope.cognitiveFailureConfigMapName" . }}
  labels:
    {{- include "scope.labels" . | nindent 4 }}
data:
  cognitive_failure_config.yaml: |
{{ toYaml (default dict (index .Values.workers "cognitive-failure").config) | indent 4 }}
