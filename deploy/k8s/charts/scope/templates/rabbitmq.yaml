{{- if .Values.rabbitmq.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "scope.rabbitmqName" . }}
  labels:
    {{- include "scope.labels" . | nindent 4 }}
    app.kubernetes.io/component: rabbitmq
spec:
  type: {{ .Values.rabbitmq.service.type }}
  selector:
    {{- include "scope.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: rabbitmq
  ports:
    - name: amqp
      port: {{ .Values.rabbitmq.service.ports.amqp }}
      targetPort: amqp
    - name: manager
      port: {{ .Values.rabbitmq.service.ports.manager }}
      targetPort: manager

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "scope.rabbitmqName" . }}
  labels:
    {{- include "scope.labels" . | nindent 4 }}
    app.kubernetes.io/component: rabbitmq
spec:
  serviceName: {{ include "scope.rabbitmqName" . }}
  replicas: {{ default 1 .Values.rabbitmq.replicaCount }}
  selector:
    matchLabels:
      {{- include "scope.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: rabbitmq
  template:
    metadata:
      labels:
        {{- include "scope.labels" . | nindent 8 }}
        app.kubernetes.io/component: rabbitmq
    spec:
      {{- if not .Values.rabbitmq.persistence.enabled }}
      volumes:
        - name: data
          emptyDir: {}
      {{- end }}
      containers:
        - name: rabbitmq
          image: "{{ .Values.rabbitmq.image.repository }}:{{ .Values.rabbitmq.image.tag }}"
          imagePullPolicy: {{ .Values.rabbitmq.image.pullPolicy }}
          ports:
            - name: amqp
              containerPort: {{ .Values.rabbitmq.service.ports.amqp }}
            - name: manager
              containerPort: {{ .Values.rabbitmq.service.ports.manager }}
          env:
            - name: RABBITMQ_DEFAULT_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "scope.rabbitmqSecretName" . }}
                  key: {{ include "scope.rabbitmqUsernameKey" . }}
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ include "scope.rabbitmqSecretName" . }}
                  key: {{ include "scope.rabbitmqPasswordKey" . }}
          livenessProbe:
            tcpSocket:
              port: amqp
            initialDelaySeconds: 20
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: amqp
            initialDelaySeconds: 10
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/rabbitmq
          resources:
            {{- toYaml .Values.rabbitmq.resources | nindent 12 }}
  {{- if .Values.rabbitmq.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: {{ .Values.rabbitmq.persistence.size }}
        {{- with .Values.rabbitmq.persistence.storageClassName }}
        storageClassName: {{ . | quote }}
        {{- end }}
  {{- end }}
{{- end }}
