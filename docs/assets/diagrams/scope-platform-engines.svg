<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1460 980" width="1460" height="980" font-family="Inter, &apos;Helvetica Neue&apos;, Helvetica, Arial, sans-serif"><rect x="0" y="0" width="100%" height="100%" fill="#000000"/>

  <defs>
    <marker id="aGrey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#858585"/>
    </marker>
    <marker id="aOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#FFA91F"/>
    </marker>
    <marker id="aRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#D44D3F"/>
    </marker>
    <marker id="aDark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#B5B5B5"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1460" height="980" fill="#000000"/>

  <!-- ============ TITLE ============ -->
  <text x="60" y="36" font-size="24" font-weight="600" fill="#A3C3ED">SCOPE, with the Platform Engines on top</text>
  <text x="60" y="60" font-size="13.5" fill="#7F8FA4">Two engines are called synchronously by the AgentBridge and gate a phase; two run on accumulated telemetry. All four feed one Detection to Trigger stage.</text>

  <!-- ============ OPEs BAND (on top) ============ -->
  <rect x="90" y="88" width="1270" height="212" rx="12" fill="#372A02" stroke="#FFA91F" stroke-width="2.5"/>
  <text x="725" y="114" font-size="16" font-weight="600" fill="#FFD385" text-anchor="middle">PEs — SCOPE Platform Engines</text>

  <rect x="110" y="126" width="296" height="104" rx="9" fill="#FFB40F" stroke="#FFC147" stroke-width="2"/>
  <text x="258" y="156" font-size="14" font-weight="600" fill="#FFEBC2" text-anchor="middle">Semantic Analysis</text>
  <text x="258" y="177" font-size="10" font-style="italic" fill="#FFEBC2" text-anchor="middle">term divergence · grounding</text>
  <text x="258" y="192" font-size="10" font-style="italic" fill="#FFEBC2" text-anchor="middle">equality across agents</text>
  <text x="258" y="216" font-size="9.5" font-weight="600" fill="#FFB385" text-anchor="middle">SYNC · gates a phase</text>

  <rect x="426" y="126" width="296" height="104" rx="9" fill="#FFB40F" stroke="#FFC147" stroke-width="2"/>
  <text x="574" y="156" font-size="14" font-weight="600" fill="#FFEBC2" text-anchor="middle">Symbolic eval</text>
  <text x="574" y="177" font-size="10" font-style="italic" fill="#FFEBC2" text-anchor="middle">formal checks on the frame</text>
  <text x="574" y="192" font-size="10" font-style="italic" fill="#FFEBC2" text-anchor="middle">and acceptance criteria</text>
  <text x="574" y="216" font-size="9.5" font-weight="600" fill="#FFB385" text-anchor="middle">SYNC · gates a phase</text>

  <rect x="742" y="126" width="296" height="104" rx="9" fill="#A56F08" stroke="#FFC147" stroke-width="2"/>
  <text x="890" y="156" font-size="14" font-weight="600" fill="#FFEBC2" text-anchor="middle">Wasted Resources</text>
  <text x="890" y="177" font-size="10" font-style="italic" fill="#FFEBC2" text-anchor="middle">redundant work · dead branches</text>
  <text x="890" y="192" font-size="10" font-style="italic" fill="#FFEBC2" text-anchor="middle">re-derivation across agents</text>
  <text x="890" y="216" font-size="9.5" font-weight="600" fill="#FFEE94" text-anchor="middle">ASYNC · telemetry-driven</text>

  <rect x="1058" y="126" width="296" height="104" rx="9" fill="#A56F08" stroke="#FFC147" stroke-width="2"/>
  <text x="1206" y="156" font-size="14" font-weight="600" fill="#FFEBC2" text-anchor="middle">Root Cause Analysis</text>
  <text x="1206" y="177" font-size="10" font-style="italic" fill="#FFEBC2" text-anchor="middle">failed outcome traced back</text>
  <text x="1206" y="192" font-size="10" font-style="italic" fill="#FFEBC2" text-anchor="middle">to its originating phase</text>
  <text x="1206" y="216" font-size="9.5" font-weight="600" fill="#FFEE94" text-anchor="middle">ASYNC · telemetry-driven</text>

  <rect x="110" y="242" width="1244" height="48" rx="8" fill="#270D09" stroke="#D44D3F" stroke-width="2"/>
  <text x="732" y="263" font-size="13.5" font-weight="600" fill="#E17F73" text-anchor="middle">Detection → Trigger</text>
  <text x="732" y="281" font-size="10" font-style="italic" fill="#E17F73" text-anchor="middle">what any engine finds becomes a scoped delta or a phase re-run, emitted back into the AgentBridges</text>

  <!-- ============ EXTERNAL COUPLING ============ -->
  <path d="M34,178 L104,178" fill="none" stroke="#FFA91F" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#aOrange)"/>
  <text x="24" y="178" font-size="10.5" font-weight="600" fill="#FFB74C" text-anchor="middle" transform="rotate(-90 24 178)">from the AgentBridges</text>

  <path d="M1360,266 L1420,266" fill="none" stroke="#D44D3F" stroke-width="3" marker-end="url(#aRed)"/>
  <text x="1438" y="266" font-size="10.5" font-weight="600" fill="#D44D3F" text-anchor="middle" transform="rotate(-90 1438 266)">to the AgentBridges</text>

  <!-- ============ OPEs <-> CORE ============ -->
  <line x1="725" y1="300" x2="725" y2="340" stroke="#B5B5B5" stroke-width="3.5" marker-start="url(#aDark)" marker-end="url(#aDark)"/>
  <text x="742" y="325" font-size="10.5" font-style="italic" fill="#7F8FA4">read layers · write findings back</text>

  <!-- ============ SCOPE CORE ============ -->
  <rect x="90" y="340" width="1270" height="300" rx="12" fill="#0D0D0D" stroke="#737373" stroke-width="2.5"/>
  <text x="725" y="368" font-size="17" font-weight="600" fill="#CCCCCC" text-anchor="middle">SCOPE core</text>

  <rect x="110" y="382" width="900" height="188" rx="9" fill="#28070A" stroke="#75363C" stroke-width="1.5"/>
  <text x="126" y="404" font-size="13" font-weight="600" fill="#D5949A">Multi-layer Knowledge Graph</text>
  <rect x="250" y="412" width="740" height="48" rx="7" fill="#150305" stroke="#75565A" stroke-width="1.5"/>
  <text x="620" y="442" font-size="13" fill="#DDB5B9" text-anchor="middle">Symbolic / Causal layer</text>
  <rect x="250" y="466" width="740" height="48" rx="7" fill="#150305" stroke="#75565A" stroke-width="1.5"/>
  <text x="620" y="496" font-size="13" fill="#DDB5B9" text-anchor="middle">Semantic layer</text>
  <rect x="250" y="520" width="740" height="48" rx="7" fill="#150305" stroke="#75565A" stroke-width="1.5"/>
  <text x="620" y="550" font-size="13" fill="#DDB5B9" text-anchor="middle">Normalized / Syntactic layer</text>

  <rect x="1030" y="382" width="310" height="188" rx="9" fill="#051A30" stroke="#2B5480" stroke-width="1.5"/>
  <text x="1185" y="405" font-size="13" font-weight="600" fill="#99BDE4" text-anchor="middle">Evaluation and Scoring</text>
  <rect x="1046" y="418" width="278" height="64" rx="7" fill="#134780" stroke="#477DB5" stroke-width="1.5"/>
  <text x="1185" y="456" font-size="13" font-weight="600" fill="#B0D1EF" text-anchor="middle">Eval LaaJ / GT</text>
  <rect x="1046" y="496" width="278" height="64" rx="7" fill="#A1C5ED" stroke="#BFD8F4" stroke-width="1.5"/>
  <text x="1185" y="534" font-size="13" font-weight="600" fill="#000000" text-anchor="middle">Agntcy MCE</text>

  <rect x="110" y="580" width="1230" height="48" rx="8" fill="#182D11" stroke="#4D7C41" stroke-width="1.5"/>
  <text x="126" y="610" font-size="13" font-weight="600" fill="#B1D8AA">Datastore</text>
  <rect x="250" y="586" width="1074" height="36" rx="6" fill="#134780" stroke="#477DB5" stroke-width="1.5"/>
  <text x="787" y="610" font-size="13" font-weight="600" fill="#B0D1EF" text-anchor="middle">Raw Telemetry</text>

  <!-- ============ INGEST : SCHEMA ADAPTER ============ -->
  <line x1="725" y1="672" x2="725" y2="644" stroke="#858585" stroke-width="3" marker-end="url(#aGrey)"/>
  <text x="742" y="666" font-size="10.5" font-style="italic" fill="#7F8FA4">normalized spans → Datastore</text>

  <rect x="170" y="676" width="1110" height="58" rx="10" fill="#8FE8E3" stroke="#B0F1ED" stroke-width="2"/>
  <text x="725" y="701" font-size="15.5" font-weight="600" fill="#000000" text-anchor="middle">SCOPE schema adapter</text>
  <text x="725" y="721" font-size="10.5" font-style="italic" fill="#19403C" text-anchor="middle">maps any OTLP source onto the SCOPE schema — the only ingest contract SCOPE core depends on</text>

  <line x1="435" y1="762" x2="435" y2="738" stroke="#858585" stroke-width="3" marker-end="url(#aGrey)"/>
  <line x1="1015" y1="762" x2="1015" y2="738" stroke="#858585" stroke-width="3" marker-end="url(#aGrey)"/>

  <!-- ============ INSTRUMENTATION (pluggable) ============ -->
  <rect x="170" y="762" width="530" height="78" rx="10" fill="#4B88E0"/>
  <text x="435" y="792" font-size="15.5" font-weight="600" fill="#000000" text-anchor="middle">Agntcy Observe</text>
  <text x="435" y="814" font-size="10.5" fill="#082130" text-anchor="middle">one possible Otel instrumentation</text>
  <text x="435" y="830" font-size="10.5" font-style="italic" fill="#082130" text-anchor="middle">L9-aware span conventions out of the box</text>

  <rect x="750" y="762" width="530" height="78" rx="10" fill="#040D17" stroke="#4B88E0" stroke-width="2.5" stroke-dasharray="8 5"/>
  <text x="1015" y="792" font-size="15.5" font-weight="600" fill="#A3C3ED" text-anchor="middle">Any other Otel instrumentation</text>
  <text x="1015" y="814" font-size="10.5" fill="#94B2D3" text-anchor="middle">vendor SDK · framework auto-instrumentation · custom</text>
  <text x="1015" y="830" font-size="10.5" font-style="italic" fill="#94B2D3" text-anchor="middle">conforms via the adapter, not by rewriting the agent</text>

  <line x1="435" y1="866" x2="435" y2="844" stroke="#858585" stroke-width="3" marker-end="url(#aGrey)"/>
  <line x1="1015" y1="866" x2="1015" y2="844" stroke="#858585" stroke-width="3" marker-end="url(#aGrey)"/>

  <!-- ============ MAS ============ -->
  <rect x="170" y="866" width="1110" height="84" rx="12" fill="#4B88E0"/>
  <text x="725" y="904" font-size="20" font-weight="600" fill="#000000" text-anchor="middle">MAS</text>
  <text x="725" y="928" font-size="11" fill="#082130" text-anchor="middle">agents (Otel SDK) + AgentBridges (phase events)</text>

<!-- ioc:dark sans="Helvetica Neue, Helvetica, Arial, sans-serif" --></svg>
