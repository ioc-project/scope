name: ioc-scaling-oxp

# Workers assemble the AMQP URL from these parts, so no connection string with
# embedded credentials is needed here.
x-rabbitmq-env: &rabbitmq-env
  RABBITMQ_HOST: rabbitmq
  RABBITMQ_PORT: 5672
  RABBITMQ_USER: ${RABBITMQ_USER:-guest}
  RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest} # legit:ignore

x-worker-env: &worker-env
  <<: *rabbitmq-env
  HOME: /claris
  MPLCONFIGDIR: /claris/.config/matplotlib
  API_BASE_URL: http://host.docker.internal:8081
  NEO4J_HOST: neo4j:7687
  NEO4J_URI: bolt://neo4j:7687
  UV_LINK_MODE: copy
  UV_PROJECT_ENVIRONMENT: /opt/venv
  PYTHONUNBUFFERED: 1
  MLFLOW_TRACKING_URI: http://${MLFLOW_HOST}:${MLFLOW_PORT}
  CLICKHOUSE_HOST: ${CLICKHOUSE_HOST:-host.docker.internal}
  CLICKHOUSE_PORT: ${CLICKHOUSE_PORT:-8123}
  CLICKHOUSE_USERNAME: ${CLICKHOUSE_USERNAME:-admin}
  CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-admin}

# Prebuilt worker images published by oxp-lib CI to GHCR.
# Override the registry or tag if needed, e.g. OXP_IMG_TAG=1.2.3.
x-worker-base: &worker-base
  platform: linux/amd64
  env_file:
    - path: .env
      required: false
  depends_on:
    rabbitmq:
      condition: service_healthy
    neo4j:
      condition: service_healthy
  volumes:
    - type: bind
      source: ${MCE_CONFIG_FILE:-../../deploy/docker-compose/config/mce_config.yaml}
      target: /claris/mce_config.yaml
    - /dev/null:/app/workflows/.env
  environment: *worker-env

services:

  event-exporter:
    build: ./event-exporter
    ports:
      - "4417:4417"
    volumes:
      - ${EVENT_EXPORTER_CONFIG_FILE:-./event-exporter/config.yaml}:/config.yaml:ro
    environment:
      CONFIG_FILE: /config.yaml
      GRPC_PORT: 4417
      CLICKHOUSE_ENDPOINT: ${CLICKHOUSE_ENDPOINT:-}
      CLICKHOUSE_HOST: ${CLICKHOUSE_HOST:-host.docker.internal}
      CLICKHOUSE_PORT: ${CLICKHOUSE_PORT:-8123}
      CLICKHOUSE_USERNAME: ${CLICKHOUSE_USERNAME:-admin}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-admin}
      CLICKHOUSE_DATABASE: ${CLICKHOUSE_DATABASE:-default}
      CLICKHOUSE_TIMEOUT: ${CLICKHOUSE_TIMEOUT:-10s}
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest} # legit:ignore
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 10s
      timeout: 5s
      retries: 5

  claris-api:
    build:
      context: ./ioc-analytics-api
      additional_contexts:
        scope_backend: ../../backend
        ontology: ../../ontology
      dockerfile: api/Dockerfile
    env_file: .env
    environment:
      CLARIS_API_RELOAD: "false"
      CACHE_REDIS_URL: redis://redis:6379/0
      CLICKHOUSE_HOST: ${CLICKHOUSE_HOST:-host.docker.internal}
      CLICKHOUSE_PORT: ${CLICKHOUSE_PORT:-8123}
      CLICKHOUSE_USERNAME: ${CLICKHOUSE_USERNAME:-admin}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-admin}
      CLICKHOUSE_DATABASE: ${CLICKHOUSE_DATABASE:-claris}
      NEO4J_HOST: neo4j
      NEO4J_PORT: ${NEO4J_PORT:-7687}
      NEO4J_USERNAME: ${NEO4J_USERNAME:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-}
      NEO4J_DATABASE: ${NEO4J_DATABASE:-neo4j}
    ports:
      - "8081:8000"
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  neo4j:
    image: neo4j:latest
    volumes:
        - /$HOME/neo4j/logs:/logs
        - /$HOME/neo4j/config:/config
        - /$HOME/neo4j/data:/data
        - /$HOME/neo4j/plugins:/plugins
    ports:
      - "7474:7474"
      - "7687:7687"
    restart: always
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:-testpassword} # legit:ignore
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  norm:
    <<: *worker-base
    image: ${CLARIS_REGISTRY:-ghcr.io/cisco-eti/oxp/container-images}/oxp-worker-norm:${OXP_IMG_TAG:-latest}
    command: ["--max-sessions", "-1"]
    environment:
      <<: *worker-env
      MAX_INFLIGHT_MESSAGES: ${NORM_MAX_INFLIGHT_MESSAGES:-64}
    restart: always

  embedding:
    <<: *worker-base
    image: ${CLARIS_REGISTRY:-ghcr.io/cisco-eti/oxp/container-images}/oxp-worker-embedding:${OXP_IMG_TAG:-latest}
    command: ["--embedder-type", "OpenAIEmbedder", "--embedding-model", "${EMBEDDING_MODEL:-azure/text-embedding-3-small}"]
    environment:
      <<: *worker-env
      MAX_INFLIGHT_MESSAGES: ${EMBEDDING_MAX_INFLIGHT_MESSAGES:-16}
      EMBEDDING_OUTPUT_QUEUE: ${EMBEDDING_OUTPUT_QUEUE:-new_session_to_grouping,new_session_embedding_to_decision_block}
    restart: always
    depends_on:
      rabbitmq:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      norm:
        condition: service_started

  mce:
    <<: *worker-base
    build:
      context: ../../backend
      additional_contexts:
        ontology: ../../ontology
      dockerfile: workers/mce-worker/deploy/docker/Dockerfile
    entrypoint: ["/opt/venv/bin/mce-worker-cli"]
    environment:
      <<: *worker-env
      MCE_CONFIG_PATH: /claris/mce_config.yaml
      NEO4J_DB: ${NEO4J_DATABASE:-neo4j}
      MAX_INFLIGHT_MESSAGES: ${MCE_MAX_INFLIGHT_MESSAGES:-16}
    restart: always
    depends_on:
      rabbitmq:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      norm:
        condition: service_started

  grouping:
    <<: *worker-base
    image: ${CLARIS_REGISTRY:-ghcr.io/cisco-eti/oxp/container-images}/oxp-worker-grouping:${OXP_IMG_TAG:-latest}
    command: ["--embedding-model", "${EMBEDDING_MODEL:-azure/text-embedding-3-small}"]
    environment:
      <<: *worker-env
      MAX_INFLIGHT_MESSAGES: ${GROUPING_MAX_INFLIGHT_MESSAGES:-16}
    restart: always
    depends_on:
      rabbitmq:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      norm:
        condition: service_started

  analysis:
    <<: *worker-base
    image: ${CLARIS_REGISTRY:-ghcr.io/cisco-eti/oxp/container-images}/oxp-worker-analysis:${OXP_IMG_TAG:-latest}
    command:
      - "--embedding-model"
      - "${EMBEDDING_MODEL:-azure/text-embedding-3-small}"
    environment:
      <<: *worker-env
      MAX_INFLIGHT_MESSAGES: ${ANALYSIS_MAX_INFLIGHT_MESSAGES:-3}
      ANOMALY_CONFIG_FILE: ${ANOMALY_CONFIG_FILE:-}
      CONSISTENCY_CONFIG_FILE: ${CONSISTENCY_CONFIG_FILE:-}
      NORMAL_BEHAVIOUR_CONFIG_FILE: ${NORMAL_BEHAVIOUR_CONFIG_FILE:-}
    restart: always
    depends_on:
      rabbitmq:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      norm:
        condition: service_started

  hierarchical-grouping:
    <<: *worker-base
    image: ${CLARIS_REGISTRY:-ghcr.io/cisco-eti/oxp/container-images}/oxp-worker-hierarchical-grouping:${OXP_IMG_TAG:-latest}
    command:
      - "--embedding-model"
      - "${EMBEDDING_MODEL:-azure/text-embedding-3-small}"
    environment:
      <<: *worker-env
      MAX_INFLIGHT_MESSAGES: ${HIERARCHICAL_GROUPING_MAX_INFLIGHT_MESSAGES:-1}
    restart: always
    depends_on:
      rabbitmq:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      norm:
        condition: service_started

  decision-block:
    <<: *worker-base
    image: ${CLARIS_REGISTRY:-ghcr.io/cisco-eti/oxp/container-images}/oxp-worker-decision-block:${OXP_IMG_TAG:-latest}
    environment:
      <<: *worker-env
      MAX_INFLIGHT_MESSAGES: ${DECISION_BLOCK_MAX_INFLIGHT_MESSAGES:-8}
      DB_INPUT_QUEUE: ${DB_INPUT_QUEUE:-new_session_embedding_to_decision_block}
      DB_NSEVAL_OUTPUT_Q: ${DB_NSEVAL_OUTPUT_Q:-new_session_to_nseval}
      DB_STATEFUL_OUTPUT_Q: ${DB_STATEFUL_OUTPUT_Q:-new_session_to_stateful_eval}
    restart: always
    depends_on:
      rabbitmq:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      embedding:
        condition: service_started

  stateful-eval:
    <<: *worker-base
    image: ${CLARIS_REGISTRY:-ghcr.io/cisco-eti/oxp/container-images}/oxp-worker-stateful-eval:${OXP_IMG_TAG:-latest}
    environment:
      <<: *worker-env
      OPENAI_API_KEY: ${OPENAI_API_KEY:-${AI_GATEWAY_API_KEY:-}}
      STATEFUL_EVAL_INPUT_QUEUE: ${STATEFUL_EVAL_INPUT_QUEUE:-new_session_to_stateful_eval}
      MAX_INFLIGHT_MESSAGES: ${STATEFUL_EVAL_MAX_INFLIGHT_MESSAGES:-8}
    restart: always
    depends_on:
      rabbitmq:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      decision-block:
        condition: service_started
