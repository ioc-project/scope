name: scope-cognition-fabric

# Workers assemble the AMQP URL from these parts, so no connection string with
# embedded credentials is needed here.
x-rabbitmq-env: &rabbitmq-env
  RABBITMQ_HOST: rabbitmq
  RABBITMQ_PORT: 5672
  RABBITMQ_USER: ${RABBITMQ_USER:-guest}
  RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest} # legit:ignore

x-worker-env: &worker-env
  <<: *rabbitmq-env
  HOME: /claris
  MPLCONFIGDIR: /claris/.config/matplotlib
  API_BASE_URL: http://host.docker.internal:8081
  NEO4J_HOST: neo4j:7687
  NEO4J_URI: bolt://neo4j:7687
  UV_LINK_MODE: copy
  UV_PROJECT_ENVIRONMENT: /opt/venv
  PYTHONUNBUFFERED: 1
  CLICKHOUSE_HOST: ${CLICKHOUSE_HOST:-host.docker.internal}
  CLICKHOUSE_PORT: ${CLICKHOUSE_PORT:-8123}
  CLICKHOUSE_USERNAME: ${CLICKHOUSE_USERNAME:-admin}
  CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-admin}

# Prebuilt SCOPE worker image from GHCR.
# Override the registry or tag if needed, e.g. SCOPE_IMG_TAG=1.2.3.
x-worker-base: &worker-base
  platform: linux/amd64
  env_file:
    - path: .env
      required: false
  depends_on:
    rabbitmq:
      condition: service_healthy
    neo4j:
      condition: service_healthy
  volumes:
    - /dev/null:/app/workflows/.env
  environment: *worker-env

services:

  event-exporter:
    build: ./event-exporter
    ports:
      - "4417:4417"
    volumes:
      - ${EVENT_EXPORTER_CONFIG_FILE:-./event-exporter/config.yaml}:/config.yaml:ro
    environment:
      CONFIG_FILE: /config.yaml
      GRPC_PORT: 4417
      CLICKHOUSE_ENDPOINT: ${CLICKHOUSE_ENDPOINT:-}
      CLICKHOUSE_HOST: ${CLICKHOUSE_HOST:-host.docker.internal}
      CLICKHOUSE_PORT: ${CLICKHOUSE_PORT:-8123}
      CLICKHOUSE_USERNAME: ${CLICKHOUSE_USERNAME:-admin}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-admin}
      CLICKHOUSE_DATABASE: ${CLICKHOUSE_DATABASE:-default}
      CLICKHOUSE_TIMEOUT: ${CLICKHOUSE_TIMEOUT:-10s}
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest} # legit:ignore
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 10s
      timeout: 5s
      retries: 5

  ioc-analytics-api:
    build:
      context: ../../backend
      additional_contexts:
        ontology: ../../ontology
      dockerfile: api/Dockerfile
      target: cognition-fabric
      args:
        SCOPE_API_EXTRAS: --extra cognition-fabric
    env_file: .env
    environment:
      SCOPE_API_RELOAD: "false"
      SCOPE_ENABLE_COGNITION_FABRIC_ENDPOINTS: "${SCOPE_ENABLE_COGNITION_FABRIC_ENDPOINTS:-true}"
      CACHE_ENABLED: "false"
      CLICKHOUSE_HOST: ${CLICKHOUSE_HOST:-host.docker.internal}
      CLICKHOUSE_PORT: ${CLICKHOUSE_PORT:-8123}
      CLICKHOUSE_USERNAME: ${CLICKHOUSE_USERNAME:-admin}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-admin}
      CLICKHOUSE_DATABASE: ${CLICKHOUSE_DATABASE:-claris}
      NEO4J_HOST: neo4j
      NEO4J_PORT: ${NEO4J_PORT:-7687}
      NEO4J_USERNAME: ${NEO4J_USERNAME:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-}
      NEO4J_DATABASE: ${NEO4J_DATABASE:-neo4j}
    ports:
      - "8081:8000"
    restart: unless-stopped
    depends_on:
      neo4j:
        condition: service_healthy

  neo4j:
    image: neo4j:latest
    volumes:
        - /$HOME/neo4j/logs:/logs
        - /$HOME/neo4j/config:/config
        - /$HOME/neo4j/data:/data
        - /$HOME/neo4j/plugins:/plugins
    ports:
      - "7474:7474"
      - "7687:7687"
    restart: always
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:-testpassword} # legit:ignore
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  norm:
    <<: *worker-base
    image: ${SCOPE_REGISTRY:-ghcr.io/ioc-project/container-images}/scope-norm-worker:${SCOPE_IMG_TAG:-latest}
    command: ["--max-sessions", "-1"]
    environment:
      <<: *worker-env
      MAX_INFLIGHT_MESSAGES: ${NORM_MAX_INFLIGHT_MESSAGES:-64}
    restart: always
