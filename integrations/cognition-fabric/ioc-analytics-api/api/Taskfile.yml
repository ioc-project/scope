version: "3"

vars:
  API_PORT: '{{.API_PORT | default "8006"}}'
  SESSION_ID: '{{.SESSION_ID | default "e9815583-76e1-479b-9098-ba0c3f066bc8"}}'
  METRIC_ID: '{{.METRIC_ID | default "Duration"}}'
  COMPUTE_METRIC_ID: '{{.COMPUTE_METRIC_ID | default "Cost"}}'

includes:
  clients:
    taskfile: ./clients
    dir: ./clients

tasks:
  default:
    silent: true
    cmds:
      - task -l

  test-env:
    desc: Recreate the dedicated test virtualenv with project and dev dependencies
    cmds:
      - rm -rf .venv_tests
      - uv venv .venv_tests
      - uv sync --python .venv_tests/bin/python --dev

  test-env-compute:
    desc: Recreate test virtualenv including MCE provider packages for real /metrics/compute
    cmds:
      - rm -rf .venv_tests
      - uv venv .venv_tests
      - test -n "${UV_INDEX_URL}" || (echo "UV_INDEX_URL is required to resolve mce-provider-* packages" && exit 1)
      - uv sync --python .venv_tests/bin/python --dev --group mce-providers

  api-server:
    desc: Start the OXP API with uv on the configured port
    cmds:
      - uv run uvicorn scope.api:app --host 0.0.0.0 --port {{.API_PORT}} --log-level info

  test-single:
    desc: Run one GET on a real session and check for Duration and Cost in the payload
    cmds:
      - bash ./scripts/test_metrics_single.sh http://localhost:{{.API_PORT}} {{.SESSION_ID}} Duration Cost

  test-sequence:
    desc: Run the metrics endpoint checks sequentially with a pause between each request
    cmds:
      - bash ./scripts/test_metrics_sequence.sh http://localhost:{{.API_PORT}} {{.SESSION_ID}} {{.METRIC_ID}} {{.COMPUTE_METRIC_ID}}

  openapi:
    desc: Export the full OpenAPI spec (YAML) without starting the server
    cmds:
      - uv run python scripts/export_openapi.py -o specs/oxp_openapi.yaml

  client-python:
    desc: Generate the Python client in clients/python from specs/oxp_openapi.yaml (generated files are not committed)
    dir: clients/python
    cmds:
      - uv run --frozen --project ../.. --package oxp-api --only-group client-gen openapi-python-client generate --path ../../specs/oxp_openapi.yaml --config openapi-python-client.yaml --meta setup --output-path . --overwrite

  client-python-test:
    desc: Run the unit tests for the Python client CLI
    deps: [client-python]
    dir: clients/python
    cmds:
      - uv run --with pytest --with httpx --with attrs python -m pytest -q tests

  client-python-cli:
    desc: Probe a running API with the Python client CLI (override CLI_ARGS, default "health")
    deps: [client-python]
    dir: clients/python
    cmds:
      - uv run --with httpx --with attrs python -m scope_client.cli --base-url http://localhost:{{.API_PORT}} {{.CLI_ARGS | default "health"}}
