services:

  postgres-server:
    image: postgres:16
    container_name: postgres-server
    environment:
      POSTGRES_USER: oxppostgresuser
      POSTGRES_PASSWORD: oxppostgrespassword
      POSTGRES_DB: oxp
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oxppostgresuser -d oxp"]
      interval: 10s
      timeout: 5s
      retries: 5

  ioc-analytics-api:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: ioc-analytics-api
    env_file:
      - ../.env
    environment:
      CLARIS_RELOAD: "false"
      POSTGRES_HOST: postgres-server
      POSTGRES_PORT: "5432"
      POSTGRES_USER: oxppostgresuser
      POSTGRES_PASSWORD: oxppostgrespassword
      POSTGRES_DB: oxp
    ports:
      - "8000:8000"
    restart: unless-stopped
    depends_on:
      postgres-server:
        condition: service_healthy


volumes:
  postgres-data:
