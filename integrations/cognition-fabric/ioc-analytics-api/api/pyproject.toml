[project]
name = "oxp-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "clickhouse-connect>=0.11.0",
    "clickhouse-sqlalchemy>=0.3.2",
    "fastapi>=0.129.0",
    "neo4j>=6.1.0",
    "packaging>=26.0",
    "numba>=0.60.0",
    "numpy>=2.3.5",
    "pydantic-settings>=2.13.1",
    "psycopg2-binary>=2.9.10",
    "python-dotenv>=1.2.1",
    "pyyaml>=6.0",
    "requests>=2.32.5",
    "redis>=5.0.0",
    "sqlalchemy>=2.0.46",
    "umap-learn>=0.5.7",
    "uvicorn>=0.41.0",
    "ruff<=0.15.22",
    "ioc-scope-ontology[models,verify]>=1.1.0",
    "ioc-scope-mce-core>=2.0.0",
    "ioc-scope-mce-provider-native>=2.0.0",
    "ioc-scope-mce-provider-sdk>=2.0.0",
]



[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scope"]

[project.scripts]
dev = "scope.app:main"

[dependency-groups]
dev = [
    "fakeredis>=2.0.0",
    "httpx>=0.28.1",
    "pytest>=9.0.2",
]
# Generates the Python client in api/clients/python from specs/oxp_openapi.yaml (see clients/README.md).
client-gen = [
    "openapi-python-client>=0.29.1,<0.30.0",
    "ruff<=0.15.22", # run by the generator's post_hooks
]

[tool.uv]
environments = ["sys_platform == 'linux' or sys_platform == 'darwin'"]

