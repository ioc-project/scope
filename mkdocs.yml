# SCOPE documentation site (docs/ + this file).
#
# Built by .github/workflows/deploy-docs-multi.yml and published at the root of the GitHub Pages site, next to the
# generated ontology documentation (/ontologies.html, /mas/, /metrics/, ...).
# Preview locally:  pip install -r docs/requirements.txt && mkdocs serve

site_name: SCOPE
site_description: System for Cognitive Observability Provenance and Explainability.
site_url: https://ioc-project.github.io/scope/
repo_url: https://github.com/ioc-project/scope
repo_name: ioc-project/scope
edit_uri: edit/main/docs/

# Not part of the site: it only pins the build's dependencies.
exclude_docs: |
  requirements.txt

theme:
  name: material
  # Overrides partials/header.html to add the "Internet of Cognition /" link before the title.
  custom_dir: overrides
  language: en
  # Outshift's wordmark, the same file the IoC documentation site uses.
  logo: assets/outshift-logo.svg
  font:
    text: Inter
    code: Roboto Mono
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - content.code.copy
    - content.action.edit
    - search.suggest
    - search.highlight
  # One palette, deliberately: the styling in assets/extra.css is written for a dark ground.
  palette:
    scheme: slate
    primary: black
    accent: cyan

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search

# Broken links and anchors fail the build (the Pages workflow builds without --strict, so warnings
# would otherwise go unnoticed).
validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

extra:
  ioc_home_url: https://ioc-project.github.io/
  repo_license: Apache-2.0

extra_css:
  - assets/extra.css

# The tabs of the header banner: the landing page, then the four top-level topics.
nav:
  - Overview: index.md
  - Ingestion:
      - ingestion/index.md
      - Normalization:
          - ingestion/normalization/index.md
          - Normalization pipeline: ingestion/normalization/normalization.md
          - Norm worker: ingestion/normalization/norm-worker.md
          - User guide: ingestion/normalization/user-guide.md
          - Developer guide: ingestion/normalization/developer-guide.md
          - Code structure: ingestion/normalization/code-structure.md
      # One templated page per ontology, linking to its Widoco documentation (generated by the Pages workflow).
      - Ontology:
          - ingestion/ontology/index.md
          - MAS: ingestion/ontology/mas.md
          - Metrics: ingestion/ontology/metrics.md
          - Semantic: ingestion/ontology/semantic.md
          - Analysis: ingestion/ontology/analysis.md
          - Insight: ingestion/ontology/insight.md
  - Analysis:
      - analysis/index.md
      - Pipelines: analysis/pipelines.md
      - Workers:
          - analysis/workers/index.md
          - Embedding worker: analysis/workers/embedding-worker.md
          - MCE worker: analysis/workers/mce-worker.md
          - Grouping worker: analysis/workers/grouping-worker.md
          - Hierarchical grouping worker: analysis/workers/hierarchical-grouping-worker.md
          - Analysis worker: analysis/workers/analysis-worker.md
          - Anomaly detection worker: analysis/workers/anomaly-detection-worker.md
          - Consistency worker: analysis/workers/consistency-worker.md
          - Normal behaviour worker: analysis/workers/normal-behaviour-worker.md
          - Stateful eval worker: analysis/workers/stateful-eval-worker.md
          - Intelligence worker: analysis/workers/intelligence-worker.md
          - Cognitive failure worker: analysis/workers/cognitive-failure-worker.md
          - Cognition protocols worker: analysis/workers/cognition-protocols-worker.md
      - Components:
          - analysis/components/index.md
          - Analysis toolkit: analysis/components/analysis.md
          - Metrics Computation Engine: analysis/components/mce.md
          - Stateful evals: analysis/components/stateful-evals.md
          - Intelligence catalog: analysis/components/intelligence-catalog.md
          - Worker base: analysis/components/worker-base.md
  - Platform:
      - platform/index.md
      - API:
          - platform/api/index.md
          - Run the API standalone: platform/api/standalone.md
      - UI:
          - platform/ui/index.md
          - Run the UI standalone: platform/ui/standalone.md
  - Getting Started:
      - tutorials/index.md
      - Instrument your app: tutorials/instrument-your-app.md
      - Instrument OpenClaw-style MAS: tutorials/instrument-openclaw.md
      - Deploy SCOPE: tutorials/deploy-scope.md
      - Your first trace: tutorials/first-trace.md
