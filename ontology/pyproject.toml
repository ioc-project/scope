[build-system]
requires = ["hatchling", "rdflib>=6.0.0"]
build-backend = "hatchling.build"

[project]
name = "scope-ontology"
version = "1.0.6"
description = "The MAS execution ontology for SCOPE."
readme = "PACKAGE_README.md"
requires-python = ">=3.9"
authors = [
    { name = "Outshift Open", email = "oss@cisco.com" }
]
license = "Apache-2.0"
classifiers = [
    "Programming Language :: Python :: 3",
]
dependencies = [ # Optional but recommended for helper usage
    "rdflib>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
]
eval = [
    "pyshacl>=0.25.0",
    "rdflib>=6.0.0",
]
# Demonstrative tests (optional - for analytical validation of design claims)
# These are NOT required for core evaluation (materialize + query + SHACL)
# Install with: uv sync --extra eval-full
eval-full = [
    "pyshacl>=0.25.0",
    "rdflib>=6.0.0",
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
]

models = [
    "pydantic>=2.0",
]

verify = [
    "pyshacl>=0.25.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/scope_ontology"]

# Generates the SHACL shapes and the KG models when building from a source checkout
# (see hatch_build.py); they are not committed.
[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

# The build hook's outputs are gitignored, so uv must rebuild the editable install
# (re-running the hook) whenever one of its inputs changes.
[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "hatch_build.py" },
    { file = "scripts/*.py" },
    { file = "src/scope_ontology/*.ttl" },
]

[dependency-groups]
dev = [
    "pydantic>=2.13.5",
    "pytest>=8.4.2",
    "ruff<=0.15.22",
]

[tool.hatch.build]
include = [
    "hatch_build.py",
    "src/scope_ontology/*.ttl",
    "src/scope_ontology/__init__.py",
    "src/scope_ontology/validation.py",
    "src/scope_ontology/verification.py",
    "src/scope_ontology/models/__init__.py",
    "src/scope_ontology/models/base.py"
]

artifacts = [
    "src/scope_ontology/models/nodes/*.py",
    "src/scope_ontology/models/edges/*.py",
    "src/scope_ontology/mas-shapes.ttl"
]

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
# Pinned explicitly to ruff's own long-standing default selection
# (pyflakes + pycodestyle error/syntax subsets) so a ruff upgrade can't
# silently start enforcing (or stop enforcing) extra rule categories -
# see the F403/E402 CI-vs-local drift this was added to fix.
select = ["E4", "E7", "E9", "F"]
